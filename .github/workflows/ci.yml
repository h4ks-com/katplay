name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,typos-cli
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the libraries libchiaki links; bindgen needs libclang, nanopb's generator needs protoc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          cmake ninja-build git pkg-config libclang-dev clang
          libssl-dev libjson-c-dev libminiupnpc-dev libevent-dev libopus-dev
          libavcodec-dev libavutil-dev libswscale-dev libasound2-dev libudev-dev protobuf-compiler
      - if: runner.os == 'macOS'
        run: brew install cmake ninja git miniupnpc libevent opus json-c ffmpeg protobuf openssl@3
      # the chiaki-ng checkout `just chiaki` makes
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/katplay
          key: chiaki-${{ runner.os }}-${{ hashFiles('justfile') }}
      - run: just ci
