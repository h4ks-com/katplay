[package]
name = "katplay"
description = "PlayStation Remote Play in the terminal: chiaki-ng holds the session, katui draws the pixels"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["terminal", "playstation", "remote-play", "kitty-graphics"]

[dependencies]
base64 = "0.22"
cpal = "0.18"
katui = { version = "0.5.0", features = ["gamepad", "game"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"
pkg-config = "0.3"

[lints.rust]
unsafe_code = "deny"
unknown_lints = { level = "allow", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
